AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Low-cost public collection plane for generic GIS first-party telemetry

Parameters:
  SiteRegistryJson:
    Type: String
    NoEcho: true
    Description: JSON object mapping opaque site public UUIDs to exact allowed origins
  LogRetentionDays:
    Type: Number
    Default: 14
  AlarmEmail:
    Type: String
    Default: ''

Resources:
  TelemetryDlq:
    Type: AWS::SQS::Queue
    Properties:
      MessageRetentionPeriod: 1209600
      SqsManagedSseEnabled: true
  TelemetryQueue:
    Type: AWS::SQS::Queue
    Properties:
      ReceiveMessageWaitTimeSeconds: 20
      VisibilityTimeout: 180
      MessageRetentionPeriod: 345600
      SqsManagedSseEnabled: true
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt TelemetryDlq.Arn
        maxReceiveCount: 5
  EdgeFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: edge/
      Handler: app.handler
      Runtime: python3.12
      Architectures: [arm64]
      MemorySize: 128
      Timeout: 5
      Environment:
        Variables:
          QUEUE_URL: !Ref TelemetryQueue
          SITE_REGISTRY_JSON: !Ref SiteRegistryJson
      Policies:
        - Statement:
            - Effect: Allow
              Action: sqs:SendMessage
              Resource: !GetAtt TelemetryQueue.Arn
      Events:
        PublicEvents:
          Type: HttpApi
          Properties:
            Path: /v1/telemetry/events
            Method: POST
            ApiId: !Ref TelemetryApi
  EdgeFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${EdgeFunction}
      RetentionInDays: !Ref LogRetentionDays
  TelemetryApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageVariables: {}
      CorsConfiguration:
        AllowOrigins: ['*']
        AllowMethods: [POST, OPTIONS]
        AllowHeaders: [content-type]
        MaxAge: 600
      DefaultRouteSettings:
        ThrottlingBurstLimit: 50
        ThrottlingRateLimit: 25
  AlarmTopic:
    Type: AWS::SNS::Topic
  AlarmSubscription:
    Type: AWS::SNS::Subscription
    Condition: HasAlarmEmail
    Properties: {Protocol: email, Endpoint: !Ref AlarmEmail, TopicArn: !Ref AlarmTopic}
  DlqDepthAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions: [{Name: QueueName, Value: !GetAtt TelemetryDlq.QueueName}]
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      AlarmActions: [!Ref AlarmTopic]
  QueueAgeAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      Namespace: AWS/SQS
      MetricName: ApproximateAgeOfOldestMessage
      Dimensions: [{Name: QueueName, Value: !GetAtt TelemetryQueue.QueueName}]
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 2
      Threshold: 900
      ComparisonOperator: GreaterThanThreshold
      AlarmActions: [!Ref AlarmTopic]
  LambdaErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions: [{Name: FunctionName, Value: !Ref EdgeFunction}]
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      AlarmActions: [!Ref AlarmTopic]
  WorkerPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      Description: Least-privilege policy for the private GIS pull worker
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action: [sqs:ReceiveMessage, sqs:DeleteMessage, sqs:ChangeMessageVisibility, sqs:GetQueueAttributes]
            Resource: !GetAtt TelemetryQueue.Arn

Conditions:
  HasAlarmEmail: !Not [!Equals [!Ref AlarmEmail, '']]

Outputs:
  CollectorUrl: {Value: !Sub 'https://${TelemetryApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}/v1/telemetry/events'}
  QueueUrl: {Value: !Ref TelemetryQueue}
  QueueArn: {Value: !GetAtt TelemetryQueue.Arn}
  DlqUrl: {Value: !Ref TelemetryDlq}
  WorkerPolicyArn: {Value: !Ref WorkerPolicy}
