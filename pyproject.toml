[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vahomemath-gis"
version = "0.2.0"
description = "VAHomeMath Growth Intelligence System data platform"
requires-python = ">=3.9"
dependencies = [
  "alembic>=1.13,<2",
  "google-auth>=2.35,<3",
  "psycopg[binary]>=3.1,<4",
  "requests>=2.32,<3",
  "sqlalchemy>=2.0,<3",
  "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = [
  "build>=1.2,<2",
  "mypy>=1.10,<2",
  "pytest>=8,<9",
  "ruff>=0.6,<1",
  "types-requests>=2.32,<3",
]

[project.scripts]
gis-gsc = "gis.integrations.gsc.cli:main"
gis-seed = "gis.seed:main"

[tool.hatch.build.targets.wheel]
packages = ["src/gis"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501", "UP045"]

[tool.mypy]
python_version = "3.9"
strict = true
packages = ["gis"]
