name: CI

on:
  pull_request:
  push:

jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: gis_test
          POSTGRES_USER: gis
          POSTGRES_PASSWORD: gis
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gis -d gis_test"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://gis:gis@localhost:5432/gis_test
      DATABASE_URL: postgresql+psycopg://gis:gis@localhost:5432/gis_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e '.[dev]'
      - run: ruff check .
      - run: mypy
      - run: pytest
      - run: alembic upgrade head
      - run: alembic check
      - run: python -m build
