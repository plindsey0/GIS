services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${GIS_DB_NAME:-gis}
      POSTGRES_USER: ${GIS_DB_USER:-gis}
      POSTGRES_PASSWORD: ${GIS_DB_PASSWORD:-gis}
    ports:
      - "${GIS_DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gis -d gis"]
      interval: 2s
      timeout: 5s
      retries: 15
    volumes:
      - gis-postgres-data:/var/lib/postgresql/data

  metabase:
    image: metabase/metabase:v0.63.15.x
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      MB_DB_FILE: /metabase-data/metabase.db
      MB_SITE_URL: http://localhost:${METABASE_PORT:-3030}
      MB_ANON_TRACKING_ENABLED: "false"
      JAVA_TIMEZONE: UTC
    ports:
      - "127.0.0.1:${METABASE_PORT:-3030}:3000"
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/3000' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    volumes:
      - gis-metabase-data:/metabase-data

volumes:
  gis-postgres-data:
  gis-metabase-data:
