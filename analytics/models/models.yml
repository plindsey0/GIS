version: 2

models:
  - name: stg_external_search_observations
    description: Current provider-neutral external-search collection headers with costs and rights.
    columns:
      - name: observation_id
        tests: [not_null, unique]
  - name: stg_external_keyword_rankings
    description: Current external keyword and organic ranking evidence.
    columns:
      - name: ranking_id
        tests: [not_null, unique]
  - name: stg_external_competitors
    description: Current provider and GIS-derived competitor evidence with explicit semantics.
    columns:
      - name: competitor_observation_id
        tests: [not_null, unique]
  - name: mart_external_keyword_daily
    description: External keyword/ranking evidence; traffic and volume remain provider estimates.
  - name: mart_external_domain_daily
    description: Domain keyword footprint and deterministic volume-weighted visibility.
  - name: mart_external_page_daily
    description: Ranked-page footprint and provider-estimated traffic.
  - name: mart_external_competitor_daily
    description: Provider competitor observations and separately labeled GIS-derived strength.
  - name: mart_keyword_gap
    description: External rankings compared with same-day GSC and controlled SERP evidence; not opportunity scoring.
  - name: mart_search_market_visibility
    description: Domain/date keyword footprint and deterministic ranking distribution.
  - name: stg_gsc_search_observations
    description: Current GSC observations with provider grain and provenance preserved.
    columns:
      - name: observation_id
        tests: [not_null, unique]
  - name: stg_ga4_landing_pages
    description: Current GA4 landing-page aggregates using the property reporting date.
    columns:
      - name: observation_id
        tests: [not_null, unique]
  - name: stg_ga4_acquisition
    description: Current GA4 traffic-acquisition aggregates with provider channel fields.
    columns:
      - name: observation_id
        tests: [not_null, unique]
  - name: stg_ga4_events
    description: Current GA4 aggregate event report rows, distinct from exact GIS events.
    columns:
      - name: observation_id
        tests: [not_null, unique]
  - name: stg_sessions
    description: Exact first-party sessions with site-local analytical dates.
    columns:
      - name: session_id
        tests: [not_null, unique]
  - name: stg_events
    description: Exact first-party events with occurrence and receipt timestamps.
    columns:
      - name: event_row_id
        tests: [not_null, unique]
  - name: stg_calculator_runs
    description: Exact calculator lifecycle records and bucketed attributes.
    columns:
      - name: calculator_run_id
        tests: [not_null, unique]
  - name: stg_conversions
    description: Exact canonical conversions with source-event relationships.
    columns:
      - name: conversion_row_id
        tests: [not_null, unique]
  - name: int_page_identity
    description: Lightweight tenant/site path identity across GSC, GA4, and first-party telemetry.
  - name: int_session_entry
    description: First-party session entry with page key and deterministic first-touch GIS channel.
    columns:
      - name: gis_channel
        tests:
          - accepted_values:
              arguments:
                values: [organic_search, paid_search, direct, referral, social, email, other, unknown]
  - name: int_calculator_funnel
    description: Exact run-level calculator, CTA, lead, and conversion lifecycle.
  - name: int_conversion_funnel
    description: Conversions enriched with session entry page and channel.
  - name: int_search_page_daily
    description: GSC page totals preferring page grain, with query/page fallback by site-date.
  - name: int_behavior_page_daily
    description: Page-keyed GA4 and exact first-party behavior without forced reconciliation.
  - name: int_external_keyword_history
    description: Revision-safe external ranking history with first/last observation dates and deterministic movement labels.
  - name: stg_competitive_content_observations
    description: Current revision of provider-neutral competitive content retrieval envelopes.
    columns:
      - name: observation_id
        tests: [not_null, unique]
  - name: stg_competitive_content_pages
    description: Successfully retrieved pages with deterministic document characteristics.
  - name: stg_competitive_content_components
    description: Measured and heuristic components with explicit semantic classification.
  - name: stg_competitive_content_topics
    description: GIS-derived deterministic heading n-grams; lexical evidence, not semantic identity.
  - name: int_competitive_cohort_evidence
    description: Frozen cohort membership joined to its historical page evidence.
  - name: mart_competitive_content_page_daily
    description: Page observation facts by retrieval date.
  - name: mart_competitive_content_query_daily
    description: Descriptive content characteristics by tracked query and date.
  - name: mart_competitive_content_domain_daily
    description: Descriptive content characteristics by observed domain and date.
  - name: mart_competitive_content_component_daily
    description: Component prevalence with measured/heuristic semantics preserved.
  - name: mart_competitive_content_topic_daily
    description: Deterministic lexical topic prevalence by tracked query and date.
  - name: mart_competitive_content_gap
    description: Observed cohort topic differences; never an opportunity or causal claim.
  - name: stg_technology_observations
    description: Current provider-neutral technology collection revisions.
    columns:
      - name: observation_id
        tests: [not_null, unique]
  - name: stg_technology_detections
    description: Canonical technologies with scope, version, confidence, and measured/provider/heuristic semantics.
  - name: stg_technology_evidence
    description: Versioned signature or provider evidence supporting each detection.
  - name: int_technology_history
    description: Comparable PRESENT detections sequenced without treating missing evidence as removal.
  - name: int_technology_cohort_evidence
    description: Frozen Epic 17 cohort domains joined to technology evidence observed by cohort freeze time.
  - name: int_technology_cooccurrence
    description: Exact within-observation technology pairs; descriptive and non-causal.
  - name: mart_technology_domain_daily
    description: Technologies observed by domain and day.
  - name: mart_technology_site_daily
    description: Site-level observed technology and category counts.
  - name: mart_technology_category_daily
    description: Observed technology category footprint by domain and day.
  - name: mart_technology_cohort_daily
    description: Frozen-cohort technology prevalence with exact denominators.
  - name: mart_technology_competitor_daily
    description: Descriptive competitor domain technology footprints.
  - name: mart_technology_change_daily
    description: Deterministic ADDED and VERSION_CHANGED evidence; never infers REMOVED from non-detection.
  - name: mart_technology_gap
    description: Owned-versus-competitor observed differences, not recommendations or causal findings.
  - name: stg_orchestration_runs
    description: Auditable scheduled, manual, retry, backfill, and dependency-triggered executions.
    columns:
      - name: orchestration_run_id
        tests: [not_null, unique]
  - name: stg_execution_attempts
    description: Append-only worker attempt history, including retries and failures.
    columns:
      - name: execution_attempt_id
        tests: [not_null, unique]
  - name: mart_pipeline_operations_daily
    description: Pipeline success, duration, retry, failure, backfill, and cost metrics by day.
  - name: mart_pipeline_freshness
    description: Explicit execution-derived freshness and staleness state.
  - name: mart_provider_cost_daily
    description: Actual provider cost ledger by tenant, source, pipeline, schedule, and day.
  - name: mart_budget_utilization
    description: Current daily and monthly spend relative to configured operational budgets.
  - name: mart_site_daily
    description: Executive site/day performance preserving each evidence system separately.
    columns: &daily_keys
      - name: tenant_id
        tests: [not_null]
      - name: site_id
        tests: [not_null]
      - name: date
        tests: [not_null]
  - name: mart_page_daily
    description: Page/day search, behavior, calculator, and conversion performance.
    columns: *daily_keys
  - name: mart_keyword_daily
    description: GSC-observed query visibility; it does not represent external search volume.
    columns: *daily_keys
  - name: mart_keyword_page_daily
    description: GSC query-to-page visibility and weighted position.
    columns: *daily_keys
  - name: mart_acquisition_daily
    description: GA4 provider acquisition rows plus separate first-party channel rows.
    columns:
      - name: tenant_id
        tests: [not_null]
      - name: site_id
        tests: [not_null]
      - name: date
        tests: [not_null]
      - name: gis_channel
        tests:
          - accepted_values:
              arguments:
                values: [organic_search, paid_search, direct, referral, social, email, other, unknown]
  - name: mart_calculator_performance
    description: Exact first-party calculator lifecycle metrics by site/date/type.
    columns: *daily_keys
  - name: mart_conversion_daily
    description: Canonical conversions by type and currency; currencies are never combined.
    columns: *daily_keys
  - name: mart_search_funnel
    description: Observable page/day cross-source funnel; cross-source ratios are reconciliation indicators.
    columns: *daily_keys
  - name: mart_data_reconciliation
    description: Site/day source presence, deltas, ratios, and simple quality status.
    columns: *daily_keys

  - name: stg_authority_observations
    description: Revision-aware provider observations with explicit target and ownership semantics.
    columns:
      - name: authority_observation_id
        tests: [not_null, unique]
      - name: target_type
        tests:
          - accepted_values:
              arguments: {values: [DOMAIN, PAGE]}
      - name: ownership
        tests:
          - accepted_values:
              arguments: {values: [OWNED, COMPETITOR, OTHER, UNKNOWN]}
  - name: stg_backlink_observations
    description: Canonical provider-neutral link evidence; absence is not loss.
    columns:
      - name: backlink_observation_id
        tests: [not_null, unique]
      - name: link_state
        tests:
          - accepted_values:
              arguments: {values: [OBSERVED_ACTIVE, OBSERVED_NEW, OBSERVED_LOST, UNKNOWN]}
      - name: semantic_class
        tests:
          - accepted_values:
              arguments: {values: [MEASURED, PROVIDER_REPORTED, GIS_DERIVED, HEURISTIC]}
  - name: stg_referring_domain_observations
    description: Deterministically grouped referring-domain evidence by provider observation.
    columns:
      - name: referring_domain_observation_id
        tests: [not_null, unique]
  - name: mart_authority_domain_daily
    description: Provider-specific domain authority facts; provider metrics remain non-interchangeable JSON keys.
  - name: mart_authority_page_daily
    description: Descriptive page-level external-link evidence.
  - name: mart_referring_domain_daily
    description: Historical referring-domain relationships.
  - name: mart_authority_competitor_daily
    description: Comparable owned and competitor observations without strategic inference.
  - name: mart_authority_gap
    description: Shared, owned-only, and competitor-only observed referring-domain conditions.
  - name: mart_authority_velocity
    description: Explicitly reported new/lost link velocity.
  - name: mart_authority_concentration
    description: HHI concentration and one-minus-HHI diversification.
  - name: mart_page_link_attraction
    description: Descriptive page-level acquisition observations; no causal claim.

unit_tests:
  - name: reconciliation_distinguishes_ga4_presence_from_organic_sessions
    description: GA4 presence is independent of organic traffic, including GA4-only dates.
    model: mart_data_reconciliation
    given:
      - input: ref('int_search_page_daily')
        rows:
          - {tenant_id: 00000000-0000-0000-0000-000000000001, site_id: 00000000-0000-0000-0000-000000000002, date: '2026-08-26', clicks: 5}
          - {tenant_id: 00000000-0000-0000-0000-000000000001, site_id: 00000000-0000-0000-0000-000000000002, date: '2026-08-29', clicks: 3}
      - input: ref('stg_ga4_acquisition')
        rows:
          - {tenant_id: 00000000-0000-0000-0000-000000000001, site_id: 00000000-0000-0000-0000-000000000002, observed_date: '2026-08-26', provider_channel: Organic Search, source: google, medium: organic, sessions: 4}
          - {tenant_id: 00000000-0000-0000-0000-000000000001, site_id: 00000000-0000-0000-0000-000000000002, observed_date: '2026-08-27', provider_channel: Direct, source: '(direct)', medium: '(none)', sessions: 19}
          - {tenant_id: 00000000-0000-0000-0000-000000000001, site_id: 00000000-0000-0000-0000-000000000002, observed_date: '2026-08-28', provider_channel: Direct, source: '(direct)', medium: '(none)', sessions: 11}
      - input: ref('int_session_entry')
        rows:
          - {tenant_id: 00000000-0000-0000-0000-000000000001, site_id: 00000000-0000-0000-0000-000000000002, analytical_date: '2026-08-27', gis_channel: direct}
    expect:
      rows:
        - {date: '2026-08-26', gsc_clicks: 5, ga4_organic_sessions: '4.000000', first_party_organic_sessions: 0, gsc_data_present: true, ga4_data_present: true, first_party_data_present: false}
        - {date: '2026-08-27', gsc_clicks: 0, ga4_organic_sessions: 0, first_party_organic_sessions: 0, gsc_data_present: false, ga4_data_present: true, first_party_data_present: false}
        - {date: '2026-08-28', gsc_clicks: 0, ga4_organic_sessions: 0, first_party_organic_sessions: 0, gsc_data_present: false, ga4_data_present: true, first_party_data_present: false}
        - {date: '2026-08-29', gsc_clicks: 3, ga4_organic_sessions: 0, first_party_organic_sessions: 0, gsc_data_present: true, ga4_data_present: false, first_party_data_present: false}
  - name: search_funnel_preserves_cross_source_counts
    description: Proves the documented fictional acceptance arithmetic without asserting equality.
    model: mart_search_funnel
    given:
      - input: ref('int_search_page_daily')
        rows:
          - {tenant_id: 00000000-0000-0000-0000-000000000001, site_id: 00000000-0000-0000-0000-000000000002, date: '2026-08-20', page_key: page1, normalized_path: /va-loan-calculator, impressions: 10000, clicks: 500, avg_position: 4, ctr: 0.05}
      - input: ref('int_behavior_page_daily')
        rows:
          - {tenant_id: 00000000-0000-0000-0000-000000000001, site_id: 00000000-0000-0000-0000-000000000002, date: '2026-08-20', page_key: page1, ga4_sessions: 450, ga4_engaged_sessions: 300, ga4_engagement_rate: 0.6666666667, ga4_key_events: 15, first_party_sessions: 420, calculator_starts: 180, calculator_completions: 120, cta_clicks: 35, lead_form_completions: 15, conversions: 12}
      - input: ref('int_page_identity')
        rows:
          - {tenant_id: 00000000-0000-0000-0000-000000000001, site_id: 00000000-0000-0000-0000-000000000002, page_key: page1, normalized_path: /va-loan-calculator, normalized_host: vahomemath.com, gsc_page_url: 'https://VAHomeMath.com/va-loan-calculator/?x=1', ga4_landing_page: /va-loan-calculator/, first_party_path: /va-loan-calculator, source_count: 3}
    expect:
      rows:
        - {tenant_id: 00000000-0000-0000-0000-000000000001, site_id: 00000000-0000-0000-0000-000000000002, date: '2026-08-20', page_key: page1, normalized_path: /va-loan-calculator, normalized_host: vahomemath.com, impressions: 10000, search_clicks: 500, ga4_landing_sessions: 450, first_party_sessions: 420, calculator_starts: 180, calculator_completions: 120, cta_clicks: 35, lead_form_completions: 15, conversions: 12, search_ctr: '0.05000000000000000000', click_to_ga4_session_ratio: '0.90000000000000000000', ga4_to_first_party_session_ratio: '0.93333333333333333333', calculator_start_rate: '0.42857142857142857143', calculator_completion_rate: '0.66666666666666666667', lead_rate: '0.03571428571428571429', session_conversion_rate: '0.02857142857142857143'}
