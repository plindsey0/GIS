version: 2

sources:
  - name: gis_raw
    schema: gis_raw
    description: Typed, versioned provider observations owned by application migrations.
    tables:
      - name: gsc_search_observation
        config:
          loaded_at_field: ingested_at
          freshness: {warn_after: {count: 5, period: day}}
      - name: ga4_landing_page_observation
        config:
          loaded_at_field: ingested_at
          freshness: {warn_after: {count: 5, period: day}}
      - name: ga4_acquisition_observation
        config:
          loaded_at_field: ingested_at
          freshness: {warn_after: {count: 5, period: day}}
      - name: ga4_event_observation
        config:
          loaded_at_field: ingested_at
          freshness: {warn_after: {count: 5, period: day}}
      - name: serp_observation
        config: {loaded_at_field: created_at}
      - name: serp_result
        config: {loaded_at_field: created_at}
      - name: experience_observation
        config: {loaded_at_field: created_at}
      - name: external_search_observation
        config: {loaded_at_field: created_at}
      - name: external_keyword_ranking
        config: {loaded_at_field: created_at}
      - name: external_competitor_observation
        config: {loaded_at_field: created_at}
      - name: competitive_content_observation
        config: {loaded_at_field: created_at}
      - name: competitive_content_document
      - name: competitive_content_heading
      - name: competitive_content_schema_type
      - name: competitive_content_link
      - name: competitive_content_component
      - name: competitive_content_term
  - name: gis_core
    schema: gis_core
    description: Canonical GIS entities owned by application migrations.
    tables:
      - name: tenant
      - name: site
      - name: domain
      - name: session
        config:
          loaded_at_field: created_at
          freshness: {warn_after: {count: 2, period: day}}
      - name: event
        config:
          loaded_at_field: received_at
          freshness: {warn_after: {count: 2, period: day}}
      - name: calculator_run
      - name: conversion
      - name: telemetry_transport_batch
      - name: data_source
      - name: data_source_connection
      - name: data_rights_policy
      - name: tracked_query
      - name: competitive_content_cohort
      - name: competitive_content_cohort_member
